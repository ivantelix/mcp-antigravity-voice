[project]
name = "mcp-tts-server"
version = "0.1.0"
description = "Local MCP Server for Text-to-Speech using edge-tts and pygame"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.2.0,<2.0.0",
    "edge-tts>=6.1.0",
    "pygame>=2.5.0",
    "python-dotenv>=1.0.0",
    "SpeechRecognition>=3.10.0",
    "pynput>=1.7.6",
    "pyperclip>=1.8.2",
    "pyautogui>=0.9.54",
    "pyaudio>=0.2.14",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
